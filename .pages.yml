media:
  input: assets
  output: /assets
  rename: safe
  categories: [image]
content:
  - name: projects
    label: Portfolio projects
    type: file
    path: projects.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: category
        label: Category / disciplines
        type: string
      - name: year
        label: Year
        type: string
      - name: summary
        label: Short project description
        type: text
      - name: image
        label: Cover image
        type: image
      - name: gallery
        label: More images
        type: image
        options:
          multiple: true
      - name: video_url
        label: Video URL (YouTube or Vimeo)
        type: string
        description: Paste a specific video's URL to display a player in the project detail.
      - name: project_url
        label: External project link (optional)
        type: string
      - name: featured
        label: Show on portfolio
        type: boolean
  - name: site
    label: Homepage and contact
    type: file
    path: content.json
    format: json
    fields:
      - name: hero_label
        label: Intro label
        type: string
      - name: hero_title
        label: Main headline
        type: string
      - name: hero_description
        label: Intro paragraph
        type: text
      - name: hero_image
        label: Hero image
        type: image
      - name: about_title
        label: About heading
        type: string
      - name: about_text
        label: About text
        type: text
      - name: email
        label: Contact email
        type: string
      - name: behance_url
        label: Behance URL
        type: string
      - name: linkedin_url
        label: LinkedIn URL
        type: string
      - name: video_collection_url
        label: Video collection URL
        type: string
      - name: youtube_url
        label: YouTube channel URL
        type: string
